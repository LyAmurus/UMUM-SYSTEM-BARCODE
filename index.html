<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Authentication System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>VERIFIKASI PRODUK</h2>
            <p class="subtitle">Sistem Pengecekan Keaslian Resmi</p>

            <!-- Area Pemindai Kamera Aktif -->
            <div id="reader" class="scanner-box">
                <div class="scanner-text">Memuat kamera...</div>
            </div>

            <div class="divider">ATAU CEK MANUAL</div>

            <!-- Input Barcode -->
            <input type="text" id="barcode-input" placeholder="Masukkan 11 digit kode..." maxlength="11">

            <!-- Tombol Verifikasi -->
            <button id="verify-btn" onclick="prosesVerifikasi()">
                <span id="btn-text">Verifikasi Produk</span>
                <div id="loading-spinner" class="spinner" style="display: none;"></div>
            </button>

            <!-- Kartu Hasil Pengecekan -->
            <div id="result-card" class="result-card"></div>
        </div>
    </div>

    <!-- Library HTML5-Qrcode untuk akses kamera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- CryptoJS Library untuk Enkripsi MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
